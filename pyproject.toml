[project]
name = "LUCERO-MCP"
version = "1.0.0"
description = "Surgical MCP server for .docx XML manipulation. Zero format loss. XPath precision."
authors = [{ name = "AldraAV", email = "manhalev1520@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "mcp[cli]>=1.0.0",
    "lxml>=5.2.0",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
aldradoc = "src.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
