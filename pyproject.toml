[project]
name = "LUCERO-MCP"
version = "1.0.0"
description = "Surgical MCP server for .docx XML manipulation. Zero format loss. XPath precision."
authors = [{ name = "AldraAV", email = "manhalev1520@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "mcp[cli]>=1.0.0",
    "lxml>=5.2.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.0",
    "svglib>=2.2.0",
    "pillow>=10.1.0",
    "openpyxl>=3.1.5",
    "structlog>=26.1.0",
    "aiofiles>=25.1.0",
    "pypdf>=6.18.1",
    "httpx>=0.28.1",
    "pycryptodome>=3.23.0",
    "markitdown>=0.1.7",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
aldradoc = "src.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["ppt_master_integration"]

[tool.ruff.lint]
ignore = ["ALL"]

[tool.mypy]
exclude = ["^ppt_master_integration/"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
